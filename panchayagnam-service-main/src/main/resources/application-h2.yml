server:
  port: ${H2_SERVER_PORT:8083}

spring:
  datasource:
    url: jdbc:h2:mem:py_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

# Disable scheduling during test
  task:
    scheduling:
      pool:
        size: 1

app:
  security:
    public-docs-enabled: true

trading:
  paper-trading:
    enabled: true