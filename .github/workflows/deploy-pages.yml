name: Deploy Panchayagnam Web to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Frontend Dependencies
        working-directory: ./panchayagnam-ui-main
        run: flutter pub get

      - name: Build Flutter Web Release
        working-directory: ./panchayagnam-ui-main
        run: |
          API_URL="${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://panchayagnam-api.onrender.com' }}"
          WS_URL="${{ vars.WS_BASE_URL || secrets.WS_BASE_URL || 'wss://panchayagnam-api.onrender.com' }}"
          flutter build web --release --pwa-strategy=none --base-href /${{ github.event.repository.name }}/ --dart-define=API_BASE_URL="$API_URL" --dart-define=WS_BASE_URL="$WS_URL"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./panchayagnam-ui-main/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
